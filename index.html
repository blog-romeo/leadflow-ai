<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LeadFlow AI: trova, analizza e gestisci opportunità commerciali B2B con fonti tracciate." />
    <meta name="theme-color" content="#F4F5F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D141C" media="(prefers-color-scheme: dark)" />
    <title>LeadFlow AI</title>
    <script>
      // Applica il tema prima del primo paint per evitare flash.
      try {
        var t = localStorage.getItem('lf-theme');
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
